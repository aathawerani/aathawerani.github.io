<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI moves the last responsible moment earlier for load-bearing decisions and later for regenerable decisions">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">One last responsible moment becomes two</text>
  <line x1="380" y1="52" x2="380" y2="232" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="380" y="252" text-anchor="middle" font-size="11" fill="#6b7280">human-paced Agile: decide as late as is responsible</text>
  <line x1="60" y1="150" x2="700" y2="150" stroke="#d1d5db" stroke-width="1.5"/>
  <polygon points="700,145 710,150 700,155" fill="#d1d5db"/>
  <text x="60" y="168" font-size="11" fill="#9ca3af">intent</text>
  <text x="700" y="168" text-anchor="end" font-size="11" fill="#9ca3af">production</text>
  <rect x="330" y="76" width="100" height="40" rx="6" fill="none" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="80" y="76" width="150" height="40" rx="6" fill="#bbf7d0"/>
  <text x="155" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Load-bearing</text>
  <text x="155" y="109" text-anchor="middle" font-size="10" fill="#14532d">settle before generating</text>
  <line x1="326" y1="96" x2="240" y2="96" stroke="#059669" stroke-width="2"/>
  <polygon points="242,90 232,96 242,102" fill="#059669"/>
  <text x="155" y="136" text-anchor="middle" font-size="10" fill="#4b5563">ledger, reversals, timeouts, regulation</text>
  <rect x="330" y="184" width="100" height="40" rx="6" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="530" y="184" width="150" height="40" rx="6" fill="#fecaca"/>
  <text x="605" y="203" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">Regenerable</text>
  <text x="605" y="217" text-anchor="middle" font-size="10" fill="#7f1d1d">defer, prototype, regenerate</text>
  <line x1="434" y1="204" x2="520" y2="204" stroke="#dc2626" stroke-width="2"/>
  <polygon points="518,198 528,204 518,210" fill="#dc2626"/>
  <text x="605" y="242" text-anchor="middle" font-size="10" fill="#4b5563">layouts, flows, internal structure</text>
  <text x="380" y="284" text-anchor="middle" font-size="12" fill="#4b5563">A team that keeps one rhythm for both gets each class wrong.</text>
</svg>
