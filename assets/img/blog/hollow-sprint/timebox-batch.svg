<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Same two-week time-box containing a small batch of unvalidated change in the past and a much larger batch with AI-assisted development">
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Same time-box, different batch</text>
  <text x="24" y="92" font-size="13" font-weight="600" fill="#374151">Human-paced</text>
  <text x="24" y="110" font-size="12" fill="#6b7280">pre-AI sprint</text>
  <rect x="170" y="70" width="400" height="56" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="370" y="62" text-anchor="middle" font-size="11" fill="#6b7280">2 weeks</text>
  <rect x="180" y="80" width="90" height="36" rx="4" fill="#93c5fd"/>
  <text x="225" y="103" text-anchor="middle" font-size="11" fill="#1e3a8a">batch</text>
  <line x1="580" y1="98" x2="620" y2="98" stroke="#374151" stroke-width="1.5"/>
  <polygon points="620,93 630,98 620,103" fill="#374151"/>
  <text x="640" y="94" font-size="12" fill="#374151">one review</text>
  <text x="640" y="110" font-size="12" fill="#059669">absorbs it</text>
  <text x="24" y="212" font-size="13" font-weight="600" fill="#374151">AI-assisted</text>
  <text x="24" y="230" font-size="12" fill="#6b7280">same ceremony</text>
  <rect x="170" y="180" width="400" height="76" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="370" y="172" text-anchor="middle" font-size="11" fill="#6b7280">2 weeks</text>
  <rect x="180" y="190" width="380" height="56" rx="4" fill="#fca5a5"/>
  <text x="370" y="214" text-anchor="middle" font-size="12" fill="#7f1d1d">batch</text>
  <text x="370" y="232" text-anchor="middle" font-size="11" fill="#7f1d1d">(many decisions, none yet seen by a customer)</text>
  <line x1="580" y1="218" x2="620" y2="218" stroke="#374151" stroke-width="1.5"/>
  <polygon points="620,213 630,218 620,223" fill="#374151"/>
  <text x="640" y="214" font-size="12" fill="#374151">one review</text>
  <text x="640" y="230" font-size="12" fill="#dc2626">cannot</text>
  <text x="380" y="300" text-anchor="middle" font-size="12" fill="#4b5563">The time-box still delivers value. It no longer limits risk.</text>
  <text x="380" y="318" text-anchor="middle" font-size="12" fill="#4b5563">When output per unit time rises, the same ceremony caps nothing.</text>
</svg>
