  <text x="600" y="508" text-anchor="middle" font-family="Georgia, serif" font-size="28px" fill="#1c3664">AI didn't settle the argument between planning</text>
  <text x="600" y="546" text-anchor="middle" font-family="Georgia, serif" font-size="28px" fill="#1c3664">and iterating. It split it in two.</text>
