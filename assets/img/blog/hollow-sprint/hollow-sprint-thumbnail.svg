<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 630" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="The Hollow Sprint: the same two-week sprint, before AI holding four confirmed decisions, with AI holding fourteen decisions of which only four are confirmed">
  <rect width="1200" height="630" fill="#f1f5f9"/>
  <rect x="40" y="40" width="1120" height="550" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="62px" fill="#1c3664">The Hollow Sprint</text>
  <text x="600" y="164" text-anchor="middle" font-family="'-apple-system', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27px" fill="#64748b">Same two weeks. Far more decisions nobody has confirmed.</text>
  <text x="635" y="207" text-anchor="middle" font-family="'-apple-system', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17px" letter-spacing="2" fill="#64748b">TWO-WEEK SPRINT</text>
