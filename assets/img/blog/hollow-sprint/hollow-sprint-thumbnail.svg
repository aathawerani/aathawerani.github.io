  <text x="250" y="259" text-anchor="end" font-family="'-apple-system', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23px" font-weight="600" fill="#1c3664">Before AI</text>
  <text x="250" y="359" text-anchor="end" font-family="'-apple-system', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23px" font-weight="600" fill="#1c3664">With AI</text>
