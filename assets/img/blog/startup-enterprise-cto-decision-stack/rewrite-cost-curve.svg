<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>The cost of changing your mind, over time</title>
<desc>A chart showing the cost of rewriting an architecture as customer base grows over time. The startup line stays low and flat, since rewriting is mostly internal engineering time with few customers to disrupt. The enterprise line climbs steeply, since a rewrite becomes a migration affecting existing customers, integrations, and visible failure modes as customer base and load grow. The same architectural bet that is cheap to abandon early becomes expensive to abandon later.</desc>
<defs>
<marker id="arrowhead5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- Axes -->
<line x1="60" y1="240" x2="620" y2="240" stroke="#888780" stroke-width="1" marker-end="url(#arrowhead5)"/>
<line x1="60" y1="240" x2="60" y2="40" stroke="#888780" stroke-width="1" marker-end="url(#arrowhead5)"/>
<text x="620" y="258" text-anchor="end" font-size="11" fill="#5F5E5A">customer base, over time</text>
<text x="30" y="40" text-anchor="middle" font-size="11" fill="#5F5E5A" transform="rotate(-90 30 40)" >cost</text>

<!-- Startup line: flat and low -->
<path d="M60 215 C 200 210, 380 208, 600 205" fill="none" stroke="#D85A30" stroke-width="2"/>
<text x="610" y="200" text-anchor="end" font-size="11" font-weight="600" fill="#993C1D">Startup</text>
<text x="610" y="215" text-anchor="end" font-size="10" fill="#993C1D">mostly internal cost</text>

<!-- Enterprise line: climbing steeply -->
<path d="M60 220 C 250 210, 420 130, 600 55" fill="none" stroke="#1D9E75" stroke-width="2"/>
<text x="610" y="50" text-anchor="end" font-size="11" font-weight="600" fill="#0F6E56">Enterprise</text>
<text x="610" y="65" text-anchor="end" font-size="10" fill="#0F6E56">migration, customer-facing</text>

<!-- Marker showing same bet, two points -->
<circle cx="160" cy="211" r="4" fill="#D85A30"/>
<circle cx="160" cy="213" r="4" fill="#1D9E75" opacity="0.85"/>
<line x1="160" y1="211" x2="160" y2="280" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="160" y="295" text-anchor="middle" font-size="10" fill="#5F5E5A">same bet, cheap to</text>
<text x="160" y="308" text-anchor="middle" font-size="10" fill="#5F5E5A">unwind here</text>

<circle cx="480" cy="95" r="4" fill="#1D9E75"/>
<line x1="480" y1="95" x2="480" y2="280" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="480" y="295" text-anchor="middle" font-size="10" fill="#5F5E5A">same bet, expensive</text>
<text x="480" y="308" text-anchor="middle" font-size="10" fill="#5F5E5A">to unwind here</text>

</svg>
