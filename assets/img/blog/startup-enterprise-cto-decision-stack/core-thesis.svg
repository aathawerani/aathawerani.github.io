     inkscape:window-maximized="1"
     inkscape:current-layer="svg16" />
  <title
     id="title1">Same layer, different constraint, different correct answer</title>
  <desc
     id="desc1">A diagram showing one decision layer splitting into two contexts. A startup, under capital-clock and low-reputation constraints, correctly answers with speed and disposability. An enterprise, under reputational-exposure and existing-customer constraints, correctly answers with durability and rigor. The failure mode shown at the bottom is a CTO importing the answer from the wrong context.</desc>
  <defs
     id="defs4">
    <marker
       id="arrow-grey"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M2 1L8 5L2 9"
         fill="none"
         stroke="#5F5E5A"
         stroke-width="1.5"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="path1" />
    </marker>
    <marker
       id="arrow-coral"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse"
       preserveAspectRatio="xMidYMid">
      <path
         d="M2 1L8 5L2 9"
         fill="none"
         stroke="#D85A30"
         stroke-width="1.5"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="path2" />
    </marker>
    <marker
       id="arrow-teal"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M2 1L8 5L2 9"
         fill="none"
         stroke="#1D9E75"
         stroke-width="1.5"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="path3" />
    </marker>
    <marker
       id="arrow-red"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse"
       preserveAspectRatio="xMidYMid">
      <path
         d="M2 1L8 5L2 9"
         fill="none"
         stroke="#C0392B"
         stroke-width="1.5"
         stroke-linecap="round"
         stroke-linejoin="round"
         id="path4" />
    </marker>
  </defs>
  <!-- Top: the single decision -->
  <rect
     x="240"
     y="20"
     width="200"
     height="48"
     rx="8"
     fill="#F1EFE8"
     stroke="#888780"
     stroke-width="0.75"
     id="rect4" />
  <text
     x="340"
     y="40"
     text-anchor="middle"
     font-size="13"
     font-weight="600"
     fill="#2C2C2A"
     id="text4">One decision</text>
  <text
     x="340"
     y="57"
     text-anchor="middle"
     font-size="11"
     fill="#5F5E5A"
     id="text5">e.g. ship now or build it right</text>
  <!-- Split lines from top box -->
  <path
     d="M280 68 C280 90, 170 90, 170 110"
     fill="none"
     stroke="#888780"
     stroke-width="1"
     id="path5" />
  <path
     d="M400 68 C400 90, 510 90, 510 110"
     fill="none"
     stroke="#888780"
     stroke-width="1"
     id="path6" />
  <!-- Startup branch -->
  <rect
     x="70"
     y="112"
     width="200"
     height="56"
     rx="8"
     fill="#FAECE7"
     stroke="#D85A30"
     stroke-width="0.75"
     id="rect6" />
  <text
     x="170"
     y="134"
     text-anchor="middle"
     font-size="13"
     font-weight="600"
     fill="#4A1B0C"
     id="text6">Startup constraints</text>
  <text
     x="170"
     y="152"
     text-anchor="middle"
     font-size="11"
     fill="#993C1D"
     id="text7">Capital clock, low exposure</text>
  <line
     x1="170"
     y1="168"
     x2="170"
     y2="196"
     stroke="#D85A30"
     stroke-width="1"
     marker-end="url(#arrow-coral)"
     id="line7" />
  <rect
     x="70"
     y="200"
     width="200"
     height="48"
     rx="8"
     fill="#D85A30"
     stroke="#993C1D"
     stroke-width="0.75"
     id="rect7" />
  <text
     x="170"
     y="220"
     text-anchor="middle"
     font-size="13"
     font-weight="600"
     fill="#FAECE7"
     id="text8">Correct answer</text>
  <text
     x="170"
     y="237"
     text-anchor="middle"
     font-size="11"
     fill="#F5C4B3"
     id="text9">Ship fast, stay disposable</text>
  <!-- Enterprise branch -->
  <rect
     x="410"
     y="112"
     width="200"
     height="56"
     rx="8"
     fill="#E1F5EE"
     stroke="#1D9E75"
     stroke-width="0.75"
     id="rect9" />
  <text
     x="510"
     y="134"
     text-anchor="middle"
     font-size="13"
     font-weight="600"
     fill="#04342C"
     id="text10">Enterprise constraints</text>
  <text
     x="510"
     y="152"
     text-anchor="middle"
     font-size="11"
     fill="#0F6E56"
     id="text11">Existing customers, brand</text>
  <line
     x1="510"
     y1="168"
     x2="510"
     y2="196"
     stroke="#1D9E75"
     stroke-width="1"
     marker-end="url(#arrow-teal)"
     id="line11" />
  <rect
     x="410"
     y="200"
     width="200"
     height="48"
     rx="8"
     fill="#1D9E75"
     stroke="#0F6E56"
     stroke-width="0.75"
     id="rect11" />
  <text
     x="510"
     y="220"
     text-anchor="middle"
     font-size="13"
     font-weight="600"
     fill="#E1F5EE"
     id="text12">Correct answer</text>
  <text
     x="510"
     y="237"
     text-anchor="middle"
     font-size="11"
     fill="#9FE1CB"
     id="text13">Move carefully, build durable</text>
  <!-- Failure label -->
  <rect
     x="220"
     y="308"
     width="240"
     height="48"
     rx="8"
     fill="#FCEBEB"
     stroke="#E24B4A"
     stroke-width="0.75"
     id="rect13" />
  <text
     x="340"
     y="328"
     text-anchor="middle"
     font-size="13"
     font-weight="600"
     fill="#501313"
     id="text14">The failure</text>
  <text
     x="340"
     y="345"
     text-anchor="middle"
     font-size="11"
     fill="#791F1F"
     id="text15">Importing the other context's answer</text>
  <!--
  Crossed failure arrows:
  Arrow 1: startup answer bottom-right corner → arcs DOWN and RIGHT → enterprise answer bottom-left corner
  Arrow 2: enterprise answer bottom-left corner → arcs DOWN and LEFT → startup answer bottom-right corner
  Routed via y=280 so they pass visibly below both boxes before crossing
-->
  <!-- Startup → Enterprise (orange steals green's answer) -->
  <!-- Enterprise → Startup (green steals orange's answer) -->
  <path
     d="M410 248 C410 300, 270 300, 270 248"
     fill="none"
     stroke="#C0392B"
     stroke-width="1.5"
     stroke-dasharray="5 3"
     marker-end="url(#arrow-red)"
     id="path16"
     style="marker-start:url(#arrow-coral)" />
  <!-- Connector from crossing point to failure box -->
  <line
     x1="340"
     y1="295"
     x2="340"
     y2="308"
     stroke="#C0392B"
     stroke-width="1"
     stroke-dasharray="3 3"
     id="line16" />
</svg>
