<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Build versus buy: the binding constraint differs</title>
<desc>A two by two grid. Columns are context: startup and enterprise. Rows are which option is constrained: buying and building. Startup buying is constrained by price, since procurement-grade vendors price for enterprise budgets. Startup building is the default fallback, operated largely alone with no supporting functions to absorb the work. Enterprise buying is constrained by process, since a purchase must clear procurement, security review, and legal. Enterprise building is often faster precisely because it routes around that process, and is absorbed by existing security, platform, and SRE functions once built.</desc>

<!-- Column headers -->
<rect x="200" y="20" width="220" height="32" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.75"/>
<text x="310" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">Startup</text>

<rect x="430" y="20" width="220" height="32" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
<text x="540" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">Enterprise</text>

<!-- Row labels -->
<text x="30" y="100" font-size="12" font-weight="600" fill="#2C2C2A">Buying</text>
<text x="30" y="116" font-size="12" fill="#5F5E5A">is constrained by</text>

<text x="30" y="230" font-size="12" font-weight="600" fill="#2C2C2A">Building</text>
<text x="30" y="246" font-size="12" fill="#5F5E5A">is constrained by</text>

<!-- Row 1: buying -->
<rect x="200" y="64" width="220" height="84" rx="6" fill="#FCF3EF" stroke="#D85A30" stroke-width="0.5"/>
<text x="310" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#4A1B0C">Price</text>
<text x="310" y="108" text-anchor="middle" font-size="11" fill="#4A1B0C">Procurement-grade tools</text>
<text x="310" y="124" text-anchor="middle" font-size="11" fill="#4A1B0C">priced for enterprise budgets</text>

<rect x="430" y="64" width="220" height="84" rx="6" fill="#EEF9F4" stroke="#1D9E75" stroke-width="0.5"/>
<text x="540" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Process</text>
<text x="540" y="108" text-anchor="middle" font-size="11" fill="#04342C">Procurement, security review,</text>
<text x="540" y="124" text-anchor="middle" font-size="11" fill="#04342C">legal — weeks before use</text>

<!-- Row 2: building -->
<rect x="200" y="184" width="220" height="84" rx="6" fill="#FCF3EF" stroke="#D85A30" stroke-width="0.5"/>
<text x="310" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#4A1B0C">Capacity to operate</text>
<text x="310" y="228" text-anchor="middle" font-size="11" fill="#4A1B0C">No supporting functions —</text>
<text x="310" y="244" text-anchor="middle" font-size="11" fill="#4A1B0C">whatever is built runs alone</text>

<rect x="430" y="184" width="220" height="84" rx="6" fill="#EEF9F4" stroke="#1D9E75" stroke-width="0.5"/>
<text x="540" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Nothing much —</text>
<text x="540" y="228" text-anchor="middle" font-size="11" fill="#04342C">often faster than buying,</text>
<text x="540" y="244" text-anchor="middle" font-size="11" fill="#04342C">routes around process</text>

<!-- Footer -->
<text x="340" y="296" text-anchor="middle" font-size="12" fill="#5F5E5A">The binding constraint determines the call — not which option looks technically better.</text>

</svg>
