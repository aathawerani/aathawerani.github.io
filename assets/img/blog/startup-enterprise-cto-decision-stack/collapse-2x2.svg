<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Borrowing the wrong context's tradeoff</title>
<desc>A two by two grid. Columns are context: startup and enterprise. Rows are tradeoff source: own context's correct answer versus the other context's borrowed answer. Startup with its own tradeoff: ships fast, stays disposable, correct. Startup borrowing enterprise tradeoff: heavy process before product-market fit, spending scarce time on durability nobody asked for. Enterprise with its own tradeoff: moves carefully, builds durable, correct. Enterprise borrowing startup tradeoff: minimal review and a throwaway posture applied to an initiative carrying full brand and customer exposure, taking a startup's bet with an enterprise's downside.</desc>

<!-- Column headers -->
<rect x="200" y="20" width="220" height="32" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.75"/>
<text x="310" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">Startup context</text>

<rect x="430" y="20" width="220" height="32" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
<text x="540" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">Enterprise context</text>

<!-- Row labels -->
<text x="30" y="100" font-size="12" font-weight="600" fill="#2C2C2A">Own context's</text>
<text x="30" y="116" font-size="12" font-weight="600" fill="#2C2C2A">tradeoff</text>

<text x="30" y="230" font-size="12" font-weight="600" fill="#2C2C2A">Borrowed</text>
<text x="30" y="246" font-size="12" font-weight="600" fill="#2C2C2A">tradeoff</text>

<!-- Row 1: own tradeoff (correct, green tint both) -->
<rect x="200" y="64" width="220" height="84" rx="6" fill="#FCF3EF" stroke="#D85A30" stroke-width="0.5"/>
<text x="310" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#4A1B0C">Correct</text>
<text x="310" y="108" text-anchor="middle" font-size="11" fill="#4A1B0C">Ships fast,</text>
<text x="310" y="124" text-anchor="middle" font-size="11" fill="#4A1B0C">stays disposable</text>

<rect x="430" y="64" width="220" height="84" rx="6" fill="#EEF9F4" stroke="#1D9E75" stroke-width="0.5"/>
<text x="540" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#04342C">Correct</text>
<text x="540" y="108" text-anchor="middle" font-size="11" fill="#04342C">Moves carefully,</text>
<text x="540" y="124" text-anchor="middle" font-size="11" fill="#04342C">builds durable</text>

<!-- Row 2: borrowed tradeoff (failure, red tint both) -->
<rect x="200" y="184" width="220" height="100" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
<text x="310" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#791F1F">Failure</text>
<text x="310" y="226" text-anchor="middle" font-size="11" fill="#791F1F">Heavy process before</text>
<text x="310" y="242" text-anchor="middle" font-size="11" fill="#791F1F">product-market fit —</text>
<text x="310" y="258" text-anchor="middle" font-size="11" fill="#791F1F">scarce time spent on</text>
<text x="310" y="274" text-anchor="middle" font-size="11" fill="#791F1F">durability nobody needed</text>

<rect x="430" y="184" width="220" height="100" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
<text x="540" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#791F1F">Failure</text>
<text x="540" y="226" text-anchor="middle" font-size="11" fill="#791F1F">Minimal review, a</text>
<text x="540" y="242" text-anchor="middle" font-size="11" fill="#791F1F">throwaway posture —</text>
<text x="540" y="258" text-anchor="middle" font-size="11" fill="#791F1F">a startup's bet taken</text>
<text x="540" y="274" text-anchor="middle" font-size="11" fill="#791F1F">with an enterprise's downside</text>

<!-- Footer -->
<text x="340" y="312" text-anchor="middle" font-size="12" fill="#5F5E5A">Neither failure is bad execution. Both are a tradeoff calibrated to constraints not actually in play.</text>

</svg>
