<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 244" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three ways out when waiting is valuable and delay is costly. Buy information: reduce the uncertainty instead of waiting, with a throwaway prototype, a pilot with one bank, or a limited rollout, within what a small test can see. Stage the commitment: capture part of the value through a version that commits less, a bounded version at the edge while the core stays as it is. Reduce the weight: hide the decision behind a stable interface so that less depends on it; modularity keeps the option to change. They can be combined, and not every decision should be made lighter." font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="760" height="244" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2937">Three ways out when waiting is valuable and delay is costly</text>
  <rect x="20" y="50" width="232" height="152" rx="8" fill="#eff6ff"/>
  <text x="36" y="76" font-size="13.5" font-weight="600" fill="#1c3664">Buy information</text>
  <text x="36" y="102" font-size="10.5" fill="#1f2937">Reduce the uncertainty instead</text>
  <text x="36" y="117" font-size="10.5" fill="#1f2937">of waiting: a throwaway prototype,</text>
  <text x="36" y="132" font-size="10.5" fill="#1f2937">a pilot with one bank, a limited</text>
  <text x="36" y="147" font-size="10.5" fill="#1f2937">rollout</text>
  <text x="36" y="188" font-size="10.5" font-weight="600" fill="#b45309">within what a small test can see</text>
  <rect x="264" y="50" width="232" height="152" rx="8" fill="#eff6ff"/>
  <text x="280" y="76" font-size="13.5" font-weight="600" fill="#1c3664">Stage the commitment</text>
  <text x="280" y="102" font-size="10.5" fill="#1f2937">Capture part of the value</text>
  <text x="280" y="117" font-size="10.5" fill="#1f2937">through a version that commits</text>
  <text x="280" y="132" font-size="10.5" fill="#1f2937">less: a bounded version at the</text>
  <text x="280" y="147" font-size="10.5" fill="#1f2937">edge while the core stays as it is</text>
  <text x="280" y="188" font-size="10.5" font-weight="600" fill="#b45309">commit in steps, not at once</text>
  <rect x="508" y="50" width="232" height="152" rx="8" fill="#eff6ff"/>
  <text x="524" y="76" font-size="13.5" font-weight="600" fill="#1c3664">Reduce the weight</text>
  <text x="524" y="102" font-size="10.5" fill="#1f2937">Hide the decision behind a</text>
  <text x="524" y="117" font-size="10.5" fill="#1f2937">stable interface so that less</text>
  <text x="524" y="132" font-size="10.5" fill="#1f2937">depends on it; modularity</text>
  <text x="524" y="147" font-size="10.5" fill="#1f2937">keeps the option to change</text>
  <text x="524" y="188" font-size="10.5" font-weight="600" fill="#b45309">same value, less weight</text>
  <text x="380" y="228" font-size="11" text-anchor="middle" fill="#6b7280">They can be combined, and not every decision should be made lighter.</text>

</svg>
