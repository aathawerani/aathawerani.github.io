<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 414" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Same idea, different conditions. M-Pesa in South Africa, a product: against existing alternatives, about three quarters of adults were already banked and banks and retailers already moved money; route to critical mass, an agent and merchant network too narrow, relaunched in 2014; who controlled it, the market; outcome, a target of ten million users, by March 2015 one million registered and 76,000 active, closed on 30 June 2016. Pix in Brazil, public infrastructure: against existing alternatives, free between individuals and low charges for merchants; route to critical mass, participation compulsory for institutions with more than 500,000 active accounts; who controlled it, the central bank, as infrastructure provider and rule setter; outcome, launched in November 2020, 67% of adults signed up in little over a year. Who controls a condition is part of the condition." font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="760" height="414" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2937">Same idea, different conditions</text>
  <rect x="160" y="46" width="284" height="44" rx="8" fill="#fee2e2"/>
  <text x="302" y="66" font-size="13" font-weight="600" text-anchor="middle" fill="#b91c1c">M-Pesa in South Africa</text>
  <text x="302" y="82" font-size="10" text-anchor="middle" fill="#7f1d1d">a product</text>
  <rect x="456" y="46" width="284" height="44" rx="8" fill="#dcfce7"/>
  <text x="598" y="66" font-size="13" font-weight="600" text-anchor="middle" fill="#15803d">Pix in Brazil</text>
  <text x="598" y="82" font-size="10" text-anchor="middle" fill="#166534">public infrastructure</text>
  <rect x="20" y="100" width="130" height="62" rx="8" fill="#f3f4f6"/>
  <text x="32" y="126" font-size="11" font-weight="600" fill="#1f2937">Against existing</text>
  <text x="32" y="141" font-size="11" font-weight="600" fill="#1f2937">alternatives</text>
  <rect x="160" y="100" width="284" height="62" rx="8" fill="#fef2f2"/>
  <text x="174" y="121" font-size="10.5" fill="#1f2937">About three quarters of adults</text>
  <text x="174" y="136" font-size="10.5" fill="#1f2937">already banked; banks and retailers</text>
  <text x="174" y="151" font-size="10.5" fill="#1f2937">already moved money</text>
  <rect x="456" y="100" width="284" height="62" rx="8" fill="#f0fdf4"/>
  <text x="470" y="121" font-size="10.5" fill="#1f2937">Free between individuals; low</text>
  <text x="470" y="136" font-size="10.5" fill="#1f2937">charges for merchants</text>
  <rect x="20" y="170" width="130" height="62" rx="8" fill="#f3f4f6"/>
  <text x="32" y="196" font-size="11" font-weight="600" fill="#1f2937">Route to</text>
  <text x="32" y="211" font-size="11" font-weight="600" fill="#1f2937">critical mass</text>
  <rect x="160" y="170" width="284" height="62" rx="8" fill="#fef2f2"/>
  <text x="174" y="191" font-size="10.5" fill="#1f2937">Agent and merchant network</text>
  <text x="174" y="206" font-size="10.5" fill="#1f2937">too narrow; relaunched in 2014</text>
  <rect x="456" y="170" width="284" height="62" rx="8" fill="#f0fdf4"/>
  <text x="470" y="191" font-size="10.5" fill="#1f2937">Participation compulsory for</text>
  <text x="470" y="206" font-size="10.5" fill="#1f2937">institutions with more than</text>
  <text x="470" y="221" font-size="10.5" fill="#1f2937">500,000 active accounts</text>
  <rect x="20" y="240" width="130" height="62" rx="8" fill="#f3f4f6"/>
  <text x="32" y="266" font-size="11" font-weight="600" fill="#1f2937">Who controlled it</text>
  <rect x="160" y="240" width="284" height="62" rx="8" fill="#fef2f2"/>
  <text x="174" y="261" font-size="10.5" fill="#1f2937">The market</text>
  <rect x="456" y="240" width="284" height="62" rx="8" fill="#f0fdf4"/>
  <text x="470" y="261" font-size="10.5" fill="#1f2937">The central bank, as infrastructure</text>
  <text x="470" y="276" font-size="10.5" fill="#1f2937">provider and rule setter</text>
  <rect x="20" y="310" width="130" height="62" rx="8" fill="#f3f4f6"/>
  <text x="32" y="336" font-size="11" font-weight="600" fill="#1f2937">Outcome</text>
  <rect x="160" y="310" width="284" height="62" rx="8" fill="#fef2f2"/>
  <text x="174" y="331" font-size="10.5" fill="#1f2937">Target of ten million users. By March</text>
  <text x="174" y="346" font-size="10.5" fill="#1f2937">2015, one million registered and</text>
  <text x="174" y="361" font-size="10.5" fill="#1f2937">76,000 active. Closed 30 June 2016</text>
  <rect x="456" y="310" width="284" height="62" rx="8" fill="#f0fdf4"/>
  <text x="470" y="331" font-size="10.5" fill="#1f2937">Launched November 2020; 67% of</text>
  <text x="470" y="346" font-size="10.5" fill="#1f2937">adults signed up in little over</text>
  <text x="470" y="361" font-size="10.5" fill="#1f2937">a year</text>
  <text x="380" y="398" font-size="12" font-weight="600" text-anchor="middle" fill="#1c3664">Who controls a condition is part of the condition.</text>

</svg>
