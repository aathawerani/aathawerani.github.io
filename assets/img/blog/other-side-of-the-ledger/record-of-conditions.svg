<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 280" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The record of conditions. Before the project: a premortem, assume it has already failed and explain why. At the decision: record each condition, the evidence for it, and who controls it. After launch: compare what was assumed with what happened, condition by condition. A missing condition is either never, the alternative is too strong or the regulation will not change, so close it; or not yet, the market or the timing was not ready, so keep it as an option and name the signal that would reopen it. Without the record, the explanation is written afterwards by whoever has the most influence in the room." font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="760" height="280" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
  <text x="380" y="28" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2937">The record of conditions</text>
  <text x="100" y="62" font-size="10" font-weight="600" text-anchor="middle" fill="#6b7280">BEFORE THE PROJECT</text>
  <rect x="20" y="72" width="160" height="104" rx="8" fill="#eff6ff"/>
  <text x="34" y="96" font-size="13" font-weight="600" fill="#1c3664">Premortem</text>
  <text x="34" y="118" font-size="10.5" fill="#1f2937">Assume it has already</text>
  <text x="34" y="133" font-size="10.5" fill="#1f2937">failed, and explain why</text>
  <line x1="182" y1="124" x2="198" y2="124" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="280" y="62" font-size="10" font-weight="600" text-anchor="middle" fill="#6b7280">AT THE DECISION</text>
  <rect x="200" y="72" width="160" height="104" rx="8" fill="#eff6ff"/>
  <text x="214" y="96" font-size="13" font-weight="600" fill="#1c3664">Record</text>
  <text x="214" y="118" font-size="10.5" fill="#1f2937">Each condition, the</text>
  <text x="214" y="133" font-size="10.5" fill="#1f2937">evidence for it, and</text>
  <text x="214" y="148" font-size="10.5" fill="#1f2937">who controls it</text>
  <line x1="362" y1="124" x2="378" y2="124" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="460" y="62" font-size="10" font-weight="600" text-anchor="middle" fill="#6b7280">AFTER LAUNCH</text>
  <rect x="380" y="72" width="160" height="104" rx="8" fill="#eff6ff"/>
  <text x="394" y="96" font-size="13" font-weight="600" fill="#1c3664">Compare</text>
  <text x="394" y="118" font-size="10.5" fill="#1f2937">What was assumed with</text>
  <text x="394" y="133" font-size="10.5" fill="#1f2937">what happened, condition</text>
  <text x="394" y="148" font-size="10.5" fill="#1f2937">by condition</text>
  <line x1="562" y1="110" x2="578" y2="88" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="562" y1="140" x2="578" y2="162" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="580" y="50" width="160" height="84" rx="8" fill="#fee2e2"/>
  <text x="594" y="72" font-size="13" font-weight="600" fill="#b91c1c">Never</text>
  <text x="594" y="92" font-size="10.5" fill="#7f1d1d">Alternative too strong,</text>
  <text x="594" y="107" font-size="10.5" fill="#7f1d1d">regulation will not change:</text>
  <text x="594" y="122" font-size="10.5" fill="#7f1d1d">close it</text>
  <rect x="580" y="142" width="160" height="96" rx="8" fill="#dcfce7"/>
  <text x="594" y="164" font-size="13" font-weight="600" fill="#15803d">Not yet</text>
  <text x="594" y="184" font-size="10.5" fill="#166534">Market or timing not</text>
  <text x="594" y="199" font-size="10.5" fill="#166534">ready: keep it as an option,</text>
  <text x="594" y="214" font-size="10.5" fill="#166534">name the signal that</text>
  <text x="594" y="229" font-size="10.5" fill="#166534">would reopen it</text>
  <text x="380" y="264" font-size="11" text-anchor="middle" fill="#6b7280">Without the record, the explanation is written afterwards by whoever has the most influence in the room.</text>

</svg>
