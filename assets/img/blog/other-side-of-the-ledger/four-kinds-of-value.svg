<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 296" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four kinds of value. Direct value: revenue or cost saved; for example a product sold, or a reconciliation that needs fewer people; rough model: customers × adoption × price × months. Losses avoided: money not lost; for example a fraud caught, a reversal settled once not twice, a penalty that never comes; rough model: how often × average loss × share prevented. Enabling value: what it makes possible; for example support for a new payment scheme, or a ledger model other products build on; rough model: value of what it unlocks × chance we pursue it. Option value: a choice kept open; for example a capability ready for something that has not happened yet; rough model: hard to price, judge it as a strategic choice. One investment often carries several kinds. All four can end up as money; they are not measured the same way." font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="760" height="296" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Four kinds of value</text>
  <g>
    <rect x="12" y="46" width="178" height="208" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <rect x="12" y="46" width="178" height="34" rx="8" fill="#dcfce7"/><rect x="12" y="66" width="178" height="14" fill="#dcfce7"/>
    <text x="101" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">Direct value</text>
    <text x="24" y="102" font-size="11" font-weight="600" fill="#1f2937">Revenue or cost saved</text>
    <text x="24" y="128" font-size="9.5" font-weight="600" fill="#6b7280">EXAMPLE</text>
    <text x="24" y="144" font-size="10.5" fill="#4b5563">A product sold; a</text>
    <text x="24" y="159" font-size="10.5" fill="#4b5563">reconciliation that needs</text>
    <text x="24" y="174" font-size="10.5" fill="#4b5563">fewer people</text>
    <text x="24" y="204" font-size="9.5" font-weight="600" fill="#6b7280">ROUGH MODEL</text>
    <text x="24" y="220" font-size="10.5" fill="#374151">customers × adoption ×</text>
    <text x="24" y="235" font-size="10.5" fill="#374151">price × months</text>
  </g>
  <g>
    <rect x="198" y="46" width="178" height="208" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <rect x="198" y="46" width="178" height="34" rx="8" fill="#fef3c7"/><rect x="198" y="66" width="178" height="14" fill="#fef3c7"/>
    <text x="287" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">Losses avoided</text>
    <text x="210" y="102" font-size="11" font-weight="600" fill="#1f2937">Money not lost</text>
    <text x="210" y="128" font-size="9.5" font-weight="600" fill="#6b7280">EXAMPLE</text>
    <text x="210" y="144" font-size="10.5" fill="#4b5563">A fraud caught; a reversal</text>
    <text x="210" y="159" font-size="10.5" fill="#4b5563">settled once, not twice;</text>
    <text x="210" y="174" font-size="10.5" fill="#4b5563">a penalty that never comes</text>
    <text x="210" y="204" font-size="9.5" font-weight="600" fill="#6b7280">ROUGH MODEL</text>
    <text x="210" y="220" font-size="10.5" fill="#374151">how often × average loss</text>
    <text x="210" y="235" font-size="10.5" fill="#374151">× share prevented</text>
  </g>
  <g>
    <rect x="384" y="46" width="178" height="208" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <rect x="384" y="46" width="178" height="34" rx="8" fill="#dbeafe"/><rect x="384" y="66" width="178" height="14" fill="#dbeafe"/>
    <text x="473" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Enabling value</text>
    <text x="396" y="102" font-size="11" font-weight="600" fill="#1f2937">What it makes possible</text>
    <text x="396" y="128" font-size="9.5" font-weight="600" fill="#6b7280">EXAMPLE</text>
    <text x="396" y="144" font-size="10.5" fill="#4b5563">Support for a new payment</text>
    <text x="396" y="159" font-size="10.5" fill="#4b5563">scheme; a ledger model</text>
    <text x="396" y="174" font-size="10.5" fill="#4b5563">other products build on</text>
    <text x="396" y="204" font-size="9.5" font-weight="600" fill="#6b7280">ROUGH MODEL</text>
    <text x="396" y="220" font-size="10.5" fill="#374151">value of what it unlocks</text>
    <text x="396" y="235" font-size="10.5" fill="#374151">× chance we pursue it</text>
  </g>
  <g>
    <rect x="570" y="46" width="178" height="208" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <rect x="570" y="46" width="178" height="34" rx="8" fill="#e5e7eb"/><rect x="570" y="66" width="178" height="14" fill="#e5e7eb"/>
    <text x="659" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Option value</text>
    <text x="582" y="102" font-size="11" font-weight="600" fill="#1f2937">A choice kept open</text>
    <text x="582" y="128" font-size="9.5" font-weight="600" fill="#6b7280">EXAMPLE</text>
    <text x="582" y="144" font-size="10.5" fill="#4b5563">A capability ready for</text>
    <text x="582" y="159" font-size="10.5" fill="#4b5563">something that has not</text>
    <text x="582" y="174" font-size="10.5" fill="#4b5563">happened yet</text>
    <text x="582" y="204" font-size="9.5" font-weight="600" fill="#6b7280">ROUGH MODEL</text>
    <text x="582" y="220" font-size="10.5" fill="#374151">hard to price; judge it</text>
    <text x="582" y="235" font-size="10.5" fill="#374151">as a strategic choice</text>
  </g>
  <text x="380" y="280" text-anchor="middle" font-size="11" fill="#6b7280">One investment often carries several kinds. All four can end up as money; they are not measured the same way.</text>
</svg>
