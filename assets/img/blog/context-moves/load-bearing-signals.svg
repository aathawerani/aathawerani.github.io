<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Six signals of a load-bearing decision. How much rests on it: spread, reach beyond the code, outside dependents, reversal path. How far the context has moved: validator distance, accumulation. Each with a question and an example from the post." font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Six questions to find a load-bearing decision</text>

  <g font-size="10.5">
    <text x="16" y="58" font-size="10" font-weight="600" fill="#6b7280">SIGNAL</text>
    <text x="150" y="58" font-size="10" font-weight="600" fill="#6b7280">THE QUESTION</text>
    <text x="470" y="58" font-size="10" font-weight="600" fill="#6b7280">IN THIS POST</text>

    <rect x="8" y="66" width="744" height="22" fill="#1c3664"/>
    <text x="16" y="81" font-size="10.5" font-weight="600" fill="#ffffff">HOW MUCH RESTS ON IT</text>

    <text x="16" y="108" font-size="12" font-weight="600" fill="#1f2937">Spread</text>
    <text x="150" y="104" fill="#374151">How many parts of the system, teams and</text>
    <text x="150" y="119" fill="#374151">processes assume it?</text>
    <text x="470" y="104" fill="#4b5563">Uber's fare and fee collection</text>
    <text x="470" y="119" fill="#4b5563">assumed a card on file</text>

    <rect x="8" y="128" width="744" height="44" fill="#f9fafb"/>
    <text x="16" y="154" font-size="12" font-weight="600" fill="#1f2937">Reach</text>
    <text x="150" y="146" fill="#374151">What does it affect beyond the code: money,</text>
    <text x="150" y="161" fill="#374151">customer promises, contracts, regulation?</text>
    <text x="470" y="146" fill="#4b5563">who sets the price moved revenue, money</text>
    <text x="470" y="161" fill="#4b5563">flow, the promise and responsibility</text>

    <text x="16" y="196" font-size="12" font-weight="600" fill="#1f2937">Outside dependents</text>
    <text x="150" y="190" fill="#374151">Who outside the company depends on it, and</text>
    <text x="150" y="205" fill="#374151">can we change it without their cooperation?</text>
    <text x="470" y="190" fill="#4b5563">applications written against S3's</text>
    <text x="470" y="205" fill="#4b5563">interface and Stripe's API</text>

    <rect x="8" y="214" width="744" height="44" fill="#f9fafb"/>
    <text x="16" y="240" font-size="12" font-weight="600" fill="#1f2937">Reversal path</text>
    <text x="150" y="232" fill="#374151">Can it change beside the core or behind a</text>
    <text x="150" y="247" fill="#374151">fence, or only in place?</text>
    <text x="470" y="232" fill="#4b5563">Uber Flex and Flexi Ride sat beside</text>
    <text x="470" y="247" fill="#4b5563">the core rather than replacing it</text>

    <rect x="8" y="270" width="744" height="22" fill="#b45309"/>
    <text x="16" y="285" font-size="10.5" font-weight="600" fill="#ffffff">HOW FAR THE CONTEXT HAS MOVED</text>

    <text x="16" y="312" font-size="12" font-weight="600" fill="#1f2937">Validator distance</text>
    <text x="150" y="306" fill="#374151">Do the people who confirmed it still</text>
    <text x="150" y="321" fill="#374151">represent who we serve, and who regulates us?</text>
    <text x="470" y="306" fill="#4b5563">San Francisco riders with cards, then</text>
    <text x="470" y="321" fill="#4b5563">riders in India who preferred cash</text>

    <rect x="8" y="330" width="744" height="44" fill="#f9fafb"/>
    <text x="16" y="356" font-size="12" font-weight="600" fill="#1f2937">Accumulation</text>
    <text x="150" y="348" fill="#374151">How fast is more being built on it, and by</text>
    <text x="150" y="363" fill="#374151">whom?</text>
    <text x="470" y="348" fill="#4b5563">a philosophy that became load-bearing;</text>
    <text x="470" y="363" fill="#4b5563">faster now that AI writes more code</text>
  </g>
  <text x="380" y="404" text-anchor="middle" font-size="11" fill="#4b5563">Questions, not a score. The answers change as more is built and as the context moves.</text>
</svg>
