<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 330" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AWS as two validation transitions: inside Amazon, a brownfield change confirmed by engineers and the chief executive; outside, a novel service that only developers could confirm, through usage. Internal approval did not validate the external business." font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">AWS: one effort, two validation transitions</text>

  <!-- inside -->
  <rect x="30" y="50" width="320" height="180" rx="10" fill="#f3f4f6"/>
  <text x="46" y="76" font-size="12" font-weight="600" fill="#6b7280">INSIDE AMAZON · BROWNFIELD · 2000–03</text>
  <text x="46" y="104" font-size="11" font-weight="600" fill="#374151">The question</text>
  <text x="46" y="121" font-size="11" fill="#4b5563">Should we build software differently,</text>
  <text x="46" y="137" font-size="11" fill="#4b5563">decoupled from infrastructure?</text>
  <text x="46" y="165" font-size="11" font-weight="600" fill="#374151">Who could say yes</text>
  <text x="46" y="182" font-size="11" fill="#4b5563">Engineers with a real pain, close to the</text>
  <text x="46" y="198" font-size="11" fill="#4b5563">work, and a chief executive who approved it</text>
  <text x="46" y="218" font-size="11" font-weight="600" fill="#15803d">Answer: approved internally</text>

  <!-- outside -->
  <rect x="410" y="50" width="320" height="180" rx="10" fill="#dbeafe"/>
  <text x="426" y="76" font-size="12" font-weight="600" fill="#1e3a8a">OUTSIDE · NOVEL SERVICE · 2006 ON</text>
  <text x="426" y="104" font-size="11" font-weight="600" fill="#1e3a8a">The question</text>
  <text x="426" y="121" font-size="11" fill="#1e3a8a">Is infrastructure, sold as simple services,</text>
  <text x="426" y="137" font-size="11" fill="#1e3a8a">a problem developers will pay to solve?</text>
  <text x="426" y="165" font-size="11" font-weight="600" fill="#1e3a8a">Who could say yes</text>
  <text x="426" y="182" font-size="11" fill="#1e3a8a">Developers as a population, starting with</text>
  <text x="426" y="198" font-size="11" fill="#1e3a8a">"very early preview customers"</text>
  <text x="426" y="218" font-size="11" font-weight="600" fill="#1e3a8a">Answer: only through usage</text>

  <!-- gap -->
  <line x1="352" y1="140" x2="402" y2="140" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="402,134 410,140 402,146" fill="#b91c1c"/>
  <text x="380" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">Internal approval did not validate the external business.</text>

  <!-- what stayed -->
  <rect x="30" y="268" width="700" height="40" rx="8" fill="#1c3664"/>
  <text x="380" y="293" text-anchor="middle" font-size="11.5" fill="#ffffff">What stayed: a simple object-storage interface (PUT and GET), with principles that proved durable over time</text>
</svg>
