<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Card payment: money flows from rider to platform to driver, and the platform deducts its commission. Cash payment: money flows from rider to driver, the platform must collect its commission from the driver, and the fare must be known before the trip ends." font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Cash looks like a payment option. It reverses who holds the money.</text>

  <!-- card panel -->
  <rect x="20" y="50" width="350" height="250" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="195" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Card</text>
  <g font-size="11">
    <rect x="40" y="100" width="90" height="40" rx="6" fill="#e5e7eb"/><text x="85" y="125" text-anchor="middle" font-weight="600" fill="#374151">rider</text>
    <rect x="150" y="100" width="90" height="40" rx="6" fill="#1e3a8a"/><text x="195" y="125" text-anchor="middle" font-weight="600" fill="#ffffff">platform</text>
    <rect x="260" y="100" width="90" height="40" rx="6" fill="#e5e7eb"/><text x="305" y="125" text-anchor="middle" font-weight="600" fill="#374151">driver</text>
    <line x1="130" y1="120" x2="146" y2="120" stroke="#16a34a" stroke-width="2.5"/><polygon points="144,115 152,120 144,125" fill="#16a34a"/>
    <line x1="240" y1="120" x2="256" y2="120" stroke="#16a34a" stroke-width="2.5"/><polygon points="254,115 262,120 254,125" fill="#16a34a"/>
    <text x="195" y="160" text-anchor="middle" fill="#15803d">fare, minus commission</text>
    <text x="40" y="196" fill="#374151">• the platform holds the money</text>
    <text x="40" y="216" fill="#374151">• commission is deducted automatically</text>
    <text x="40" y="236" fill="#374151">• the fare can be settled after the trip</text>
    <text x="40" y="256" fill="#374151">• the driver is paid out on a schedule</text>
  </g>

  <!-- cash panel -->
  <rect x="390" y="50" width="350" height="250" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="565" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Cash</text>
  <g font-size="11">
    <rect x="410" y="100" width="90" height="40" rx="6" fill="#e5e7eb"/><text x="455" y="125" text-anchor="middle" font-weight="600" fill="#374151">rider</text>
    <rect x="520" y="100" width="90" height="40" rx="6" fill="#e5e7eb"/><text x="565" y="125" text-anchor="middle" font-weight="600" fill="#374151">driver</text>
    <rect x="630" y="100" width="90" height="40" rx="6" fill="#1e3a8a"/><text x="675" y="125" text-anchor="middle" font-weight="600" fill="#ffffff">platform</text>
    <line x1="500" y1="120" x2="516" y2="120" stroke="#16a34a" stroke-width="2.5"/><polygon points="514,115 522,120 514,125" fill="#16a34a"/>
    <line x1="610" y1="120" x2="626" y2="120" stroke="#b45309" stroke-width="2.5" stroke-dasharray="4 3"/><polygon points="624,115 632,120 624,125" fill="#b45309"/>
    <text x="455" y="160" text-anchor="middle" fill="#15803d">full fare</text>
    <text x="620" y="160" text-anchor="middle" fill="#b45309">commission, if collected</text>
    <text x="410" y="196" fill="#78350f">• the driver holds the money</text>
    <text x="410" y="216" fill="#78350f">• the platform becomes a creditor</text>
    <text x="410" y="236" fill="#78350f">• the fare must be known before arrival</text>
    <text x="410" y="256" fill="#78350f">• balances, collections, support change</text>
  </g>

  <rect x="20" y="314" width="720" height="48" rx="8" fill="#f3f4f6"/>
  <text x="380" y="334" text-anchor="middle" font-size="11" fill="#374151">Uber's engineers on adding cash in India: "Unwinding the systems to support cash was a major engineering challenge."</text>
  <text x="380" y="351" text-anchor="middle" font-size="10" fill="#6b7280">Uber Engineering, "Cash for India Growth and Beyond"</text>
</svg>
