<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What comes with a bought system: above the waterline, what is evaluated (features, price, the demo, the compliance checklist); below it, a data model and boundaries shaped by the vendor's teams, a roadmap set by the vendor's other customers, assumptions validated in the vendor's context, and the people who know how it works" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">What comes with a bought system</text>

  <!-- above water -->
  <polygon points="290,112 335,46 425,46 470,112" fill="#e5e7eb"/>
  <text x="380" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">what we evaluate</text>
  <text x="380" y="86" text-anchor="middle" font-size="10.5" fill="#4b5563">features, price, the demo,</text>
  <text x="380" y="101" text-anchor="middle" font-size="10.5" fill="#4b5563">the compliance checklist</text>
  <text x="560" y="74" font-size="10.5" fill="#6b7280">validated by our requirements,</text>
  <text x="560" y="89" font-size="10.5" fill="#6b7280">today</text>

  <!-- waterline -->
  <line x1="30" y1="112" x2="730" y2="112" stroke="#60a5fa" stroke-width="2"/>
  <rect x="30" y="112" width="700" height="210" fill="#eff6ff"/>

  <!-- below water -->
  <polygon points="300,112 460,112 600,316 160,316" fill="#1c3664"/>
  <g font-size="11" fill="#ffffff" text-anchor="middle">
    <text x="380" y="142" font-weight="600">a data model and boundaries</text>
    <text x="380" y="157" fill="#bfdbfe">shaped by the vendor's own teams</text>
    <text x="380" y="186" font-weight="600">a release rhythm and a roadmap</text>
    <text x="380" y="201" fill="#bfdbfe">set with the vendor's other customers</text>
    <text x="380" y="230" font-weight="600">assumptions about customers and regulators</text>
    <text x="380" y="245" fill="#bfdbfe">validated in the vendor's context, not ours</text>
    <text x="380" y="274" font-weight="600">contracts, support, and the people</text>
    <text x="380" y="289" fill="#bfdbfe">who understand its design decisions</text>
  </g>
  <text x="44" y="140" font-size="10.5" fill="#1e3a8a" font-weight="600">Conway's law:</text>
  <text x="44" y="155" font-size="10.5" fill="#1e3a8a">a system mirrors the</text>
  <text x="44" y="170" font-size="10.5" fill="#1e3a8a">communication structure</text>
  <text x="44" y="185" font-size="10.5" fill="#1e3a8a">of the organization</text>
  <text x="44" y="200" font-size="10.5" fill="#1e3a8a">that built it</text>

  <text x="380" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">We are not only buying a product. We are inheriting something of the culture that built it.</text>
</svg>
