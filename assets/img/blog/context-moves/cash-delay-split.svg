<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 306" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Uber's cash adoption in India split into its parts: about eighteen months before cash design began, a few weeks to a prototype, two to three months to make it ready to ship, and a cautious rollout over several months" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="760" height="306" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Where the time went: Uber adopting cash in India</text>
  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#6b7280">From Uber's own engineering account; months are approximate</text>

  <!-- scale: Aug 2013 (0) to early 2016 (~30 months); x 40..720 => 22.7 px/month -->
  <rect x="40" y="90" width="408" height="44" rx="6" fill="#9ca3af"/>
  <text x="244" y="117" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">about 18 months before cash design began</text>

  <rect x="450" y="90" width="22" height="44" rx="4" fill="#1e3a8a"/>
  <rect x="474" y="90" width="68" height="44" rx="4" fill="#1e3a8a"/>
  <rect x="544" y="90" width="176" height="44" rx="6" fill="#64748b"/>
  <text x="632" y="117" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">cautious rollout</text>

  <g font-size="10" fill="#6b7280">
    <line x1="40" y1="140" x2="40" y2="152" stroke="#9ca3af"/><text x="40" y="166" text-anchor="middle">Aug 2013</text>
    <text x="40" y="179" text-anchor="middle">arrives in India</text>
    <line x1="450" y1="140" x2="450" y2="152" stroke="#9ca3af"/><text x="450" y="166" text-anchor="middle">early 2015</text>
    <text x="450" y="179" text-anchor="middle">cash design begins</text>
    <line x1="544" y1="140" x2="544" y2="152" stroke="#9ca3af"/><text x="560" y="166" text-anchor="middle">mid-2015</text>
    <text x="560" y="179" text-anchor="middle">riders get it</text>
    <line x1="720" y1="140" x2="720" y2="152" stroke="#9ca3af"/><text x="716" y="166" text-anchor="end">early 2016</text>
    <text x="716" y="179" text-anchor="end">across India</text>
  </g>

  <!-- callouts for the build -->
  <line x1="461" y1="90" x2="461" y2="72" stroke="#1e3a8a"/>
  <text x="456" y="68" text-anchor="end" font-size="10" fill="#1e3a8a" font-weight="600">prototype in weeks</text>
  <line x1="508" y1="90" x2="508" y2="72" stroke="#1e3a8a"/>
  <text x="514" y="68" font-size="10" fill="#1e3a8a" font-weight="600">2–3 months to ship-ready</text>

  <rect x="40" y="196" width="330" height="78" rx="8" fill="#f3f4f6"/>
  <text x="56" y="218" font-size="11" font-weight="600" fill="#374151">Before cash design: wallets first</text>
  <text x="56" y="236" font-size="11" fill="#4b5563">Uber partnered with mobile wallets; riders and</text>
  <text x="56" y="252" font-size="11" fill="#4b5563">driver partners "would much rather pay for</text>
  <text x="56" y="268" font-size="11" fill="#4b5563">rides with cash." The rest is not recorded.</text>

  <rect x="390" y="196" width="330" height="78" rx="8" fill="#dbeafe"/>
  <text x="406" y="218" font-size="11" font-weight="600" fill="#1e3a8a">Reversing the old decision</text>
  <text x="406" y="236" font-size="11" fill="#1e3a8a">"Unwinding the systems to support cash</text>
  <text x="406" y="252" font-size="11" fill="#1e3a8a">was a major engineering challenge."</text>

  <text x="380" y="294" text-anchor="middle" font-size="11" fill="#4b5563">Even an adoption that happened mixes the cost of reversal with time that cannot be cleanly attributed.</text>
</svg>
