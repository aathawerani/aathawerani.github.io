<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 370" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart of how long it took to follow in cloud and payments, from 2 years for PayPal buying Braintree to about 8 years for Stripe Terminal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<rect x="0" y="0" width="760" height="370" fill="#ffffff"/>
<text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">How long it took to follow: cloud and payments</text>
<text x="380" y="48" text-anchor="middle" font-size="11" fill="#6b7280">From the first company's launch to the other's response</text>
<line x1="230.0" y1="62" x2="230.0" y2="272" stroke="#f3f4f6"/>
<text x="230.0" y="288" text-anchor="middle" font-size="10" fill="#6b7280">0 yr</text>
<line x1="274.4" y1="62" x2="274.4" y2="272" stroke="#f3f4f6"/>
<text x="274.4" y="288" text-anchor="middle" font-size="10" fill="#6b7280">1 yr</text>
<line x1="318.9" y1="62" x2="318.9" y2="272" stroke="#f3f4f6"/>
<text x="318.9" y="288" text-anchor="middle" font-size="10" fill="#6b7280">2 yr</text>
<line x1="363.3" y1="62" x2="363.3" y2="272" stroke="#f3f4f6"/>
<text x="363.3" y="288" text-anchor="middle" font-size="10" fill="#6b7280">3 yr</text>
<line x1="407.8" y1="62" x2="407.8" y2="272" stroke="#f3f4f6"/>
<text x="407.8" y="288" text-anchor="middle" font-size="10" fill="#6b7280">4 yr</text>
<line x1="452.2" y1="62" x2="452.2" y2="272" stroke="#f3f4f6"/>
<text x="452.2" y="288" text-anchor="middle" font-size="10" fill="#6b7280">5 yr</text>
<line x1="496.7" y1="62" x2="496.7" y2="272" stroke="#f3f4f6"/>
<text x="496.7" y="288" text-anchor="middle" font-size="10" fill="#6b7280">6 yr</text>
<line x1="541.1" y1="62" x2="541.1" y2="272" stroke="#f3f4f6"/>
<text x="541.1" y="288" text-anchor="middle" font-size="10" fill="#6b7280">7 yr</text>
<line x1="585.6" y1="62" x2="585.6" y2="272" stroke="#f3f4f6"/>
<text x="585.6" y="288" text-anchor="middle" font-size="10" fill="#6b7280">8 yr</text>
<line x1="630.0" y1="62" x2="630.0" y2="272" stroke="#f3f4f6"/>
<text x="630.0" y="288" text-anchor="middle" font-size="10" fill="#6b7280">9 yr</text>
<text x="12" y="86" font-size="11" font-weight="600" fill="#1f2937">Virtual machines</text>
<text x="12" y="100" font-size="10" fill="#6b7280">EC2 → Google Compute Engine</text>
<rect x="230" y="78" width="259.3" height="20" rx="4" fill="#b91c1c"/>
<text x="495.3" y="92" font-size="10" font-weight="600" fill="#b91c1c">about 6 years</text>
<text x="495.3" y="105" font-size="9.5" fill="#6b7280">added beside App Engine</text>
<text x="12" y="140" font-size="10" fill="#6b7280">EC2 → Azure virtual machines</text>
<rect x="230" y="118" width="259.3" height="20" rx="4" fill="#b91c1c"/>
<text x="495.3" y="132" font-size="10" font-weight="600" fill="#b91c1c">about 6 years (GA ~6½)</text>
<text x="495.3" y="145" font-size="9.5" fill="#6b7280">added beside platform services</text>
<text x="12" y="166" font-size="11" font-weight="600" fill="#1f2937">Managed Kubernetes</text>
<text x="12" y="180" font-size="10" fill="#6b7280">Kubernetes 1.0 → Amazon EKS</text>
<rect x="230" y="158" width="129.6" height="20" rx="4" fill="#d97706"/>
<text x="365.6" y="172" font-size="10" font-weight="600" fill="#d97706">about 3 years</text>
<text x="365.6" y="185" font-size="9.5" fill="#6b7280">added beside ECS</text>
<text x="12" y="206" font-size="11" font-weight="600" fill="#1f2937">Developer-first payments</text>
<text x="12" y="220" font-size="10" fill="#6b7280">Stripe → PayPal buys Braintree</text>
<rect x="230" y="198" width="88.9" height="20" rx="4" fill="#6366f1"/>
<text x="324.9" y="212" font-size="10" font-weight="600" fill="#6366f1">2 years</text>
<text x="324.9" y="225" font-size="9.5" fill="#6b7280">bought, not built</text>
<text x="12" y="246" font-size="11" font-weight="600" fill="#1f2937">In-person payments</text>
<text x="12" y="260" font-size="10" fill="#6b7280">Square → Stripe Terminal</text>
<rect x="230" y="238" width="370.4" height="20" rx="4" fill="#b91c1c"/>
<text x="606.4" y="252" font-size="10" font-weight="600" fill="#b91c1c">about 8 years</text>
<text x="606.4" y="265" font-size="9.5" fill="#6b7280">built in Stripe's API-first shape</text>
<g font-size="10">
<rect x="120" y="304" width="10" height="10" fill="#d97706"/><text x="134" y="313" fill="#374151">added beside the original</text>
<rect x="298.0" y="304" width="10" height="10" fill="#b91c1c"/><text x="312.0" y="313" fill="#374151">a different core to work around</text>
<rect x="509.6" y="304" width="10" height="10" fill="#6366f1"/><text x="523.6" y="313" fill="#374151">bought</text>
</g>
<text x="380" y="334" text-anchor="middle" font-size="9.5" fill="#9ca3af">Approximate, from launch dates in public reporting. Delay also reflects strategy and how large the rival looked.</text></svg>