<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Concentric rings showing validators moving outward as a company grows: founders and first users at the centre, then customers and the second side of a marketplace, then populations in new markets, then regulators and partner institutions" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Who can say yes moves outward as a company grows</text>

  <!-- rings centred at 240,225 -->
  <circle cx="240" cy="225" r="175" fill="#fef3c7"/>
  <circle cx="240" cy="225" r="130" fill="#e0e7ff"/>
  <circle cx="240" cy="225" r="85" fill="#dcfce7"/>
  <circle cx="240" cy="225" r="42" fill="#1e3a8a"/>
  <text x="240" y="221" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">founders,</text>
  <text x="240" y="235" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">first users</text>
  <text x="240" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">paying customers,</text>
  <text x="240" y="174" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">the second side</text>
  <text x="240" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">populations in new markets</text>
  <text x="240" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">regulators, partner banks</text>
  <text x="240" y="330" text-anchor="middle" font-size="10" fill="#6b7280">closer, fewer, faster</text>
  <text x="240" y="384" text-anchor="middle" font-size="10" fill="#92400e">further, more, slower, and often with authority you lack</text>

  <!-- examples -->
  <g font-size="11">
    <rect x="440" y="58" width="300" height="74" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="454" y="78" font-weight="600" fill="#92400e">Regulators and partner institutions</text>
    <text x="454" y="96" fill="#374151">Careem's city regulators; the banks behind</text>
    <text x="454" y="112" fill="#374151">Stripe's banking products; the banks and</text>
    <text x="454" y="126" fill="#374151">regulator once Bykea carries other people's cash</text>

    <rect x="440" y="142" width="300" height="74" rx="8" fill="#ffffff" stroke="#6366f1"/>
    <text x="454" y="162" font-weight="600" fill="#3730a3">Populations in new markets</text>
    <text x="454" y="180" fill="#374151">Uber's riders in India, who preferred cash;</text>
    <text x="454" y="196" fill="#374151">developers using AWS; inDrive's riders in</text>
    <text x="454" y="210" fill="#374151">markets where bargaining is normal</text>

    <rect x="440" y="226" width="300" height="74" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text x="454" y="246" font-weight="600" fill="#14532d">Customers and the second side</text>
    <text x="454" y="264" fill="#374151">Careem's corporate clients; inDrive's and</text>
    <text x="454" y="280" fill="#374151">Bykea's drivers and riders, who can say no</text>
    <text x="454" y="294" fill="#374151">to a fare or a payment method</text>

    <rect x="440" y="310" width="300" height="74" rx="8" fill="#ffffff" stroke="#1e3a8a"/>
    <text x="454" y="330" font-weight="600" fill="#1e3a8a">Founders and first users</text>
    <text x="454" y="348" fill="#374151">Stripe's founders and YC startups; Uber's team and</text>
    <text x="454" y="364" fill="#374151">a driver in a coffee shop; Amazon's engineers;</text>
    <text x="454" y="378" fill="#374151">Yakutsk's VKontakte group</text>
  </g>
  <text x="380" y="408" text-anchor="middle" font-size="11" fill="#4b5563">Load-bearing decisions are usually confirmed at the centre, and tested at the edge.</text>
</svg>
