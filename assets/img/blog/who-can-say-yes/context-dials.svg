<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How context moves the dials" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="600">How context moves the dials</text>
  <text x="20" y="62" font-size="12" fill="#4b5563" text-anchor="start" font-weight="600">Context</text>
  <text x="160" y="62" font-size="12" fill="#4b5563" text-anchor="start" font-weight="600">Load-bearing share</text>
  <text x="300" y="62" font-size="12" fill="#4b5563" text-anchor="start" font-weight="600">Uncertainty</text>
  <text x="440" y="62" font-size="12" fill="#4b5563" text-anchor="start" font-weight="600">Validation capacity</text>
  <text x="590" y="62" font-size="12" fill="#4b5563" text-anchor="start" font-weight="600">Who can say yes</text>
  <line x1="20" y1="72" x2="740" y2="72" stroke="#d1d5db"/>
  <rect x="14" y="80" width="732" height="40" rx="4" fill="#f9fafb"/>
  <text x="20" y="105" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">Startup</text>
  <rect x="160" y="88" width="124" height="24" rx="12" fill="#fef3c7"/>
  <text x="222.0" y="104" font-size="11" fill="#78350f" text-anchor="middle" font-weight="400">Rises fast</text>
  <rect x="300" y="88" width="124" height="24" rx="12" fill="#fee2e2"/>
  <text x="362.0" y="104" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="400">Very high</text>
  <rect x="440" y="88" width="124" height="24" rx="12" fill="#fee2e2"/>
  <text x="502.0" y="104" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="400">Low, close</text>
  <text x="590" y="105" font-size="11" fill="#374151" text-anchor="start" font-weight="400">first customers</text>
  <text x="20" y="149" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">Software house</text>
  <rect x="160" y="132" width="124" height="24" rx="12" fill="#fef3c7"/>
  <text x="222.0" y="148" font-size="11" fill="#78350f" text-anchor="middle" font-weight="400">Medium</text>
  <rect x="300" y="132" width="124" height="24" rx="12" fill="#dcfce7"/>
  <text x="362.0" y="148" font-size="11" fill="#14532d" text-anchor="middle" font-weight="400">Lower</text>
  <rect x="440" y="132" width="124" height="24" rx="12" fill="#dcfce7"/>
  <text x="502.0" y="148" font-size="11" fill="#14532d" text-anchor="middle" font-weight="400">High, in-house</text>
  <text x="590" y="149" font-size="11" fill="#374151" text-anchor="start" font-weight="400">domain experts</text>
  <rect x="14" y="168" width="732" height="40" rx="4" fill="#f9fafb"/>
  <text x="20" y="193" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">Greenfield</text>
  <rect x="160" y="176" width="124" height="24" rx="12" fill="#dcfce7"/>
  <text x="222.0" y="192" font-size="11" fill="#14532d" text-anchor="middle" font-weight="400">Low, hardens fast</text>
  <rect x="300" y="176" width="124" height="24" rx="12" fill="#fee2e2"/>
  <text x="362.0" y="192" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="400">High</text>
  <rect x="440" y="176" width="124" height="24" rx="12" fill="#fef3c7"/>
  <text x="502.0" y="192" font-size="11" fill="#78350f" text-anchor="middle" font-weight="400">Medium</text>
  <text x="590" y="193" font-size="11" fill="#374151" text-anchor="start" font-weight="400">customer, via prototypes</text>
  <text x="20" y="237" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">Brownfield</text>
  <rect x="160" y="220" width="124" height="24" rx="12" fill="#fee2e2"/>
  <text x="222.0" y="236" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="400">High</text>
  <rect x="300" y="220" width="124" height="24" rx="12" fill="#fef3c7"/>
  <text x="362.0" y="236" font-size="11" fill="#78350f" text-anchor="middle" font-weight="400">Hidden</text>
  <rect x="440" y="220" width="124" height="24" rx="12" fill="#fee2e2"/>
  <text x="502.0" y="236" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="400">Low</text>
  <text x="590" y="237" font-size="11" fill="#374151" text-anchor="start" font-weight="400">memory, counterparties</text>
  <rect x="14" y="256" width="732" height="40" rx="4" fill="#f9fafb"/>
  <text x="20" y="281" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">Project</text>
  <rect x="160" y="264" width="124" height="24" rx="12" fill="#fef3c7"/>
  <text x="222.0" y="280" font-size="11" fill="#78350f" text-anchor="middle" font-weight="400">Medium</text>
  <rect x="300" y="264" width="124" height="24" rx="12" fill="#fef3c7"/>
  <text x="362.0" y="280" font-size="11" fill="#78350f" text-anchor="middle" font-weight="400">Medium</text>
  <rect x="440" y="264" width="124" height="24" rx="12" fill="#dcfce7"/>
  <text x="502.0" y="280" font-size="11" fill="#14532d" text-anchor="middle" font-weight="400">High, direct</text>
  <text x="590" y="281" font-size="11" fill="#374151" text-anchor="start" font-weight="400">one client</text>
  <text x="20" y="325" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">Product</text>
  <rect x="160" y="308" width="124" height="24" rx="12" fill="#fee2e2"/>
  <text x="222.0" y="324" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="400">High</text>
  <rect x="300" y="308" width="124" height="24" rx="12" fill="#fef3c7"/>
  <text x="362.0" y="324" font-size="11" fill="#78350f" text-anchor="middle" font-weight="400">Medium to high</text>
  <rect x="440" y="308" width="124" height="24" rx="12" fill="#fee2e2"/>
  <text x="502.0" y="324" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="400">Slow, indirect</text>
  <text x="590" y="325" font-size="11" fill="#374151" text-anchor="start" font-weight="400">a population, via research</text>
  <rect x="14" y="344" width="732" height="40" rx="4" fill="#f9fafb"/>
  <text x="20" y="369" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">Novel idea</text>
  <rect x="160" y="352" width="124" height="24" rx="12" fill="#f3f4f6"/>
  <text x="222.0" y="368" font-size="11" fill="#374151" text-anchor="middle" font-weight="400">Varies</text>
  <rect x="300" y="352" width="124" height="24" rx="12" fill="#fee2e2"/>
  <text x="362.0" y="368" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="400">Very high</text>
  <rect x="440" y="352" width="124" height="24" rx="12" fill="#fee2e2"/>
  <text x="502.0" y="368" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="400">Very low</text>
  <text x="590" y="369" font-size="11" fill="#374151" text-anchor="start" font-weight="400">an internal champion</text>
  <text x="20" y="413" font-size="12" fill="#1f2937" text-anchor="start" font-weight="600">Crowded market</text>
  <rect x="160" y="396" width="124" height="24" rx="12" fill="#f3f4f6"/>
  <text x="222.0" y="412" font-size="11" fill="#374151" text-anchor="middle" font-weight="400">Varies</text>
  <rect x="300" y="396" width="124" height="24" rx="12" fill="#dcfce7"/>
  <text x="362.0" y="412" font-size="11" fill="#14532d" text-anchor="middle" font-weight="400">Lower</text>
  <rect x="440" y="396" width="124" height="24" rx="12" fill="#fef3c7"/>
  <text x="502.0" y="412" font-size="11" fill="#78350f" text-anchor="middle" font-weight="400">Medium</text>
  <text x="590" y="413" font-size="11" fill="#374151" text-anchor="start" font-weight="400">the market, benchmarks</text>
  <text x="380" y="446" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="400">Shading shows difficulty: red means harder for delivery (more load-bearing, more uncertain, or less validation).</text>
  <text x="380" y="462" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">Typical patterns, not fixed properties: a reasoned map, not measured data.</text>
</svg>
