<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One sprint containing four decisions, each with a different validator: memory and characterization tests, prototypes and real users, the launch customer's sign-off, and product research" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">One team, one sprint, four answers to “who can say yes?”</text>

  <rect x="20" y="50" width="720" height="40" rx="8" fill="#1e3a8a"/>
  <text x="380" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">One sprint: a novel feature on a brownfield core, for a launch customer, in a multi-tenant product</text>

  <g font-size="11">
    <line x1="110" y1="90" x2="110" y2="112" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="290" y1="90" x2="290" y2="112" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="470" y1="90" x2="470" y2="112" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="650" y1="90" x2="650" y2="112" stroke="#9ca3af" stroke-width="1.5"/>

    <rect x="24" y="114" width="172" height="62" rx="8" fill="#f3f4f6"/>
    <text x="110" y="136" text-anchor="middle" font-weight="600" fill="#1f2937">The reversal rule</text>
    <text x="110" y="154" text-anchor="middle" fill="#4b5563">in the existing core</text>
    <rect x="204" y="114" width="172" height="62" rx="8" fill="#f3f4f6"/>
    <text x="290" y="136" text-anchor="middle" font-weight="600" fill="#1f2937">The new workflow</text>
    <text x="290" y="154" text-anchor="middle" fill="#4b5563">nobody has used yet</text>
    <rect x="384" y="114" width="172" height="62" rx="8" fill="#f3f4f6"/>
    <text x="470" y="136" text-anchor="middle" font-weight="600" fill="#1f2937">This customer's limits</text>
    <text x="470" y="154" text-anchor="middle" fill="#4b5563">for its own business</text>
    <rect x="564" y="114" width="172" height="62" rx="8" fill="#f3f4f6"/>
    <text x="650" y="136" text-anchor="middle" font-weight="600" fill="#1f2937">Those limits for</text>
    <text x="650" y="154" text-anchor="middle" font-weight="600" fill="#1f2937">every other tenant?</text>

    <polygon points="105,180 110,192 115,180" fill="#9ca3af"/>
    <polygon points="285,180 290,192 295,180" fill="#9ca3af"/>
    <polygon points="465,180 470,192 475,180" fill="#9ca3af"/>
    <polygon points="645,180 650,192 655,180" fill="#9ca3af"/>

    <rect x="24" y="196" width="172" height="62" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="110" y="220" text-anchor="middle" font-weight="600" fill="#92400e">memory</text>
    <text x="110" y="238" text-anchor="middle" fill="#78350f">characterization tests</text>
    <rect x="204" y="196" width="172" height="62" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="290" y="220" text-anchor="middle" font-weight="600" fill="#14532d">real users</text>
    <text x="290" y="238" text-anchor="middle" fill="#14532d">through prototypes</text>
    <rect x="384" y="196" width="172" height="62" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="470" y="220" text-anchor="middle" font-weight="600" fill="#14532d">the customer</text>
    <text x="470" y="238" text-anchor="middle" fill="#14532d">signs off directly</text>
    <rect x="564" y="196" width="172" height="62" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="650" y="220" text-anchor="middle" font-weight="600" fill="#3730a3">a population</text>
    <text x="650" y="238" text-anchor="middle" fill="#3730a3">through product research</text>
  </g>

  <text x="380" y="286" text-anchor="middle" font-size="12" fill="#4b5563">If the unit of methodology is the decision, the topology attaches to the decision too.</text>
</svg>
