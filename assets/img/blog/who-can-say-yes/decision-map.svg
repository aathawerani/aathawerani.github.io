<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A decision map with six questions, decision, authority, evidence, availability, dependencies and default, filled in for one example: how ambiguous switch timeouts are handled" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Mapping one decision class</text>
  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Illustrative example; record the same six things for each kind of load-bearing decision</text>

  <text x="24" y="80" font-size="11" font-weight="600" fill="#6b7280">FIELD</text>
  <text x="140" y="80" font-size="11" font-weight="600" fill="#6b7280">THE QUESTION</text>
  <text x="420" y="80" font-size="11" font-weight="600" fill="#6b7280">EXAMPLE: AMBIGUOUS SWITCH TIMEOUTS</text>
  <line x1="16" y1="88" x2="744" y2="88" stroke="#d1d5db"/>

  <g font-size="11">
    <rect x="16" y="92" width="728" height="46" fill="#f9fafb"/>
    <text x="24" y="120" font-size="12" font-weight="600" fill="#1e3a8a">Decision</text>
    <text x="140" y="120" fill="#374151">what needs to be settled?</text>
    <text x="420" y="113" fill="#1f2937">does a timed-out transaction stay pending,</text>
    <text x="420" y="129" fill="#1f2937">or fail and release the funds?</text>

    <text x="24" y="166" font-size="12" font-weight="600" fill="#1e3a8a">Authority</text>
    <text x="140" y="159" fill="#374151">who can approve it, as opposed</text>
    <text x="140" y="175" fill="#374151">to who knows the answer?</text>
    <text x="420" y="159" fill="#1f2937">the bank's operations and risk owner;</text>
    <text x="420" y="175" fill="#1f2937">our architect knows, but cannot decide</text>

    <rect x="16" y="184" width="728" height="46" fill="#f9fafb"/>
    <text x="24" y="212" font-size="12" font-weight="600" fill="#1e3a8a">Evidence</text>
    <text x="140" y="205" fill="#374151">what information or experiment</text>
    <text x="140" y="221" fill="#374151">would let them decide?</text>
    <text x="420" y="205" fill="#1f2937">the switch's timeout behaviour and</text>
    <text x="420" y="221" fill="#1f2937">past reversal incidents</text>

    <text x="24" y="258" font-size="12" font-weight="600" fill="#1e3a8a">Availability</text>
    <text x="140" y="251" fill="#374151">how long will confirmation</text>
    <text x="140" y="267" fill="#374151">realistically take?</text>
    <text x="420" y="258" fill="#1f2937">the next weekly operations review</text>

    <rect x="16" y="276" width="728" height="46" fill="#f9fafb"/>
    <text x="24" y="304" font-size="12" font-weight="600" fill="#1e3a8a">Dependencies</text>
    <text x="140" y="297" fill="#374151">what is blocked, or built on</text>
    <text x="140" y="313" fill="#374151">assumptions, until it is settled?</text>
    <text x="420" y="304" fill="#1f2937">reversals, refunds and settlement</text>

    <rect x="16" y="322" width="728" height="46" fill="#fef2f2"/>
    <text x="24" y="350" font-size="12" font-weight="600" fill="#b91c1c">Default</text>
    <text x="140" y="343" fill="#374151">what actually happens if no</text>
    <text x="140" y="359" fill="#374151">one confirms it in time?</text>
    <text x="420" y="343" fill="#991b1b">the team assumes "fail after 30 seconds"</text>
    <text x="420" y="359" fill="#991b1b">and builds three flows on it</text>
  </g>

  <text x="380" y="398" text-anchor="middle" font-size="12" fill="#4b5563">The default is part of the topology too. It is often where an unconfirmed assumption becomes architecture.</text>
</svg>
